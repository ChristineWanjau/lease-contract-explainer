[project]
name = "lce-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "langchain-core>=1.8.3",
    "langchain-ollama>=1.1.0",
    "pypdf>=7.1.1",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
